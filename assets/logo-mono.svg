      <circle cx="10" cy="34" r="4.5" fill="currentColor" stroke="none"/>
      <circle cx="10" cy="50" r="4.5" fill="currentColor" stroke="none"/>
      <path d="M46 25 C46 21.7 50.5 19 56 19 C61.5 19 66 21.7 66 25 V47 C66 50.3 61.5 53 56 53 C50.5 53 46 50.3 46 47 Z" stroke-width="5"/>
