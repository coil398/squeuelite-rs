name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --features sidecar,http --tests -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # core (no optional transports) must build on its own
      - run: cargo build --verbose
      - run: cargo build --features inprocess --verbose
      # full feature set + the whole test suite
      - run: cargo test --features sidecar,http --verbose

  docs:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --features sidecar,http

  clients:
    name: clients smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the gateway
        run: cargo build --bin squeuelite-gateway --features sidecar
      - name: Smoke-test reference clients against a live gateway
        run: |
          set -euxo pipefail
          sudo apt-get update && sudo apt-get install -y sqlite3
          DB="$RUNNER_TEMP/app.db"
          SOCK="$RUNNER_TEMP/squeuelite.sock"
          sqlite3 "$DB" 'CREATE TABLE events(id INTEGER PRIMARY KEY, agent_id TEXT, kind TEXT, payload TEXT);'
          ./target/debug/squeuelite-gateway --db "$DB" --socket "$SOCK" &
          GW=$!
          trap 'kill $GW 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do [ -S "$SOCK" ] && break; sleep 0.1; done
          [ -S "$SOCK" ] || { echo "gateway socket was not created"; exit 1; }
          # Each runnable client connects, writes one row, and must report a
          # committed result (a connectivity + protocol round-trip smoke test).
          smoke() { echo "== $1 =="; shift; "$@" | tee /tmp/cli.out; grep -q committed /tmp/cli.out; }
          smoke python python3 clients/python/squeue.py "$SOCK"
          smoke node    node clients/node/squeue.mjs "$SOCK"
          smoke deno    deno run --allow-read --allow-write clients/deno/squeue.ts "$SOCK"
          smoke bun     bun clients/bun/squeue.ts "$SOCK"
          smoke jvm     java clients/jvm/Squeue.java "$SOCK"
          # The Go and Rust reference clients are libraries (no runnable demo);
          # compile-check the Go one here. The Rust client mirrors the built-in
          # `Client`, which the test suite already exercises.
          echo "== go (compile check) =="
          ( cd clients/go && go mod init squeuelite-client-demo && go build . )
