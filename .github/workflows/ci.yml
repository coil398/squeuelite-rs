name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --features sidecar,http --tests -- -D warnings

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # core (no optional transports) must build on its own
      - run: cargo build --verbose
      - run: cargo build --features inprocess --verbose
      # full feature set + the whole test suite
      - run: cargo test --features sidecar,http --verbose

  docs:
    name: doc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --features sidecar,http

  # One job per language so a failure pinpoints the exact client, and each runs
  # against its own fresh gateway (no shared-state / idempotency cross-talk).
  client-smoke:
    name: client smoke (${{ matrix.client }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [python, node, deno, bun, jvm]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: matrix.client == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - if: matrix.client == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.client == 'jvm'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # python3 and node are preinstalled on ubuntu-latest runners.
      - name: Build the gateway
        run: cargo build --bin squeuelite-gateway --features sidecar
      - name: Smoke-test the ${{ matrix.client }} client
        env:
          CLIENT: ${{ matrix.client }}
        run: |
          set -euxo pipefail
          DB="$RUNNER_TEMP/app.db"
          SOCK="$RUNNER_TEMP/squeuelite.sock"
          python3 -c "import sqlite3; sqlite3.connect('$DB').execute('CREATE TABLE events(id INTEGER PRIMARY KEY, agent_id TEXT, kind TEXT, payload TEXT)')"
          ./target/debug/squeuelite-gateway --db "$DB" --socket "$SOCK" &
          GW=$!
          trap 'kill $GW 2>/dev/null || true' EXIT
          for _ in $(seq 1 100); do [ -S "$SOCK" ] && break; sleep 0.1; done
          [ -S "$SOCK" ] || { echo "gateway socket was not created"; exit 1; }
          case "$CLIENT" in
            python) python3 clients/python/squeue.py "$SOCK" | tee out.txt ;;
            node)   node clients/node/squeue.mjs "$SOCK"     | tee out.txt ;;
            deno)   deno run --allow-read --allow-write clients/deno/squeue.ts "$SOCK" | tee out.txt ;;
            bun)    bun clients/bun/squeue.ts "$SOCK"        | tee out.txt ;;
            jvm)    java clients/jvm/Squeue.java "$SOCK"      | tee out.txt ;;
          esac
          # The single write the demo issues must come back committed.
          grep -q committed out.txt

  # The Go and Rust reference clients are libraries (no runnable demo); the Rust
  # one mirrors the built-in `Client` (already exercised by the test suite), so
  # we compile-check the Go one here.
  client-go:
    name: client go (compile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: cd clients/go && go mod init squeuelite-client-demo && go build .
