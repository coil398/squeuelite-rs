[package]
name = "squeuelite"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "A single-writer gateway for SQLite-backed agent systems: serializes concurrent writes through one SQLite writer."
license = "MIT OR Apache-2.0"
repository = "https://github.com/coil398/squeuelite-rs"
keywords = ["sqlite", "gateway", "writer", "agent", "wal"]
categories = ["database", "concurrency"]
readme = "README.md"
# Keep the published crate free of internal artifacts and CI config.
exclude = [".github/", "docs/plans/"]

[dependencies]
rusqlite = { version = "0.40" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["sync", "rt-multi-thread", "macros", "time"], optional = true }
# `rt-multi-thread`: required by `#[tokio::main]` (multi_thread flavor) used in
# the inprocess_writer example and by `#[tokio::test]`; `rt` alone is insufficient.
# `time`: required for `tokio::time::timeout` used by `OverflowPolicy::WaitTimeout` (§14).
uuid = { version = "1", features = ["v7"], optional = true }
base64 = { version = "0.22", optional = true }
axum = { version = "0.8", optional = true, default-features = false, features = ["json", "tokio", "http1"] }

[features]
# `bundled` compiles SQLite from source (SQLite 3.53.x), guaranteeing
# availability of WAL mode and other features used by the write gateway.
# It is enabled by default for reliability; opt out with
# `default-features = false` to link the system SQLite.
default = ["bundled"]
bundled = ["rusqlite/bundled"]
inprocess = ["dep:tokio", "dep:base64"]
# `sidecar` adds the Unix Domain Socket gateway (JSON-RPC 2.0) and the
# sidecar Client. Enables `inprocess` (which brings in tokio), plus
# the tokio net/io-util/signal features required for UDS accept loops (§18).
sidecar = ["inprocess", "dep:uuid", "tokio/net", "tokio/io-util", "tokio/signal", "tokio/time"]
# `http` adds the HTTP JSON-RPC endpoint (POST /rpc, GET /health) via axum 0.8.
# Enables `inprocess` (for the GatewayHandle) plus the tokio and axum features
# needed for TcpListener, graceful shutdown, and axum::serve.
# Default bind address is 127.0.0.1 (localhost); see HttpConfig for override.
# Security note: HTTP is TCP-exposed; external access and authentication are the
# caller's responsibility. Bearer token auth can be added via a tower layer.
http = ["inprocess", "dep:axum", "dep:uuid", "tokio/net", "tokio/signal", "tokio/io-util"]

[[example]]
name = "inprocess_writer"
required-features = ["inprocess"]

[[bin]]
name = "squeuelite-gateway"
path = "src/bin/squeuelite-gateway.rs"
required-features = ["sidecar"]
